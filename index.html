                                                    </table>
                                                </div>
                                            ) : (
                                                <div className="p-6 text-center text-gray-500">Nenhuma solicitação de adesão registrada.</div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'unidades' && (
                                <div>
                                    {details?.unidades ? (
                                        <div className="bg-white border rounded-xl overflow-hidden shadow-sm overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-xs text-gray-500 bg-gray-50 uppercase">
                                                    <tr>
                                                        <th className="px-4 py-3">Código</th>
                                                        <th className="px-4 py-3">Unidade / Órgão</th>
                                                        <th className="px-4 py-3">Tipo</th>
                                                        <th className="px-4 py-3 text-right">Qtd. Registrada</th>
                                                        <th className="px-4 py-3 text-right">Disponível</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-100">
                                                    {details.unidades.map((u, i) => (
                                                        <tr key={i} className="hover:bg-gray-50">
                                                            <td className="px-4 py-3 text-gray-500">{u.cod}</td>
                                                            <td className="px-4 py-3 font-medium text-gray-800">{u.nome}</td>
                                                            <td className="px-4 py-3">
                                                                <span className={`px-2 py-1 rounded-full text-xs font-medium ${u.tipo === 'Gerenciadora' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                                                                    {u.tipo}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3 text-right">{u.registrada}</td>
                                                            <td className="px-4 py-3 text-right font-semibold text-green-600">{u.disponivel}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center py-12 text-gray-500 bg-white rounded-xl border border-dashed border-gray-300">
                                            <BuildingIcon />
                                            <p className="mt-4 font-medium text-gray-700">Dados não processados</p>
                                            <p className="text-sm max-w-md text-center mt-2">O detalhamento de unidades para este item (Item {item.id}) requer integração com o banco de dados completo. (Demonstração ativa nos Itens 00001, 00002 e 00003).</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'empenhos' && (
                                <div className="space-y-6">
                                    {details?.empenhos ? (
                                        <>
                                            <div className="bg-white border rounded-xl overflow-hidden shadow-sm">
                                                <div className="bg-gray-50 px-4 py-3 border-b border-gray-100 flex justify-between items-center">
                                                    <h4 className="font-semibold text-gray-700">Relação de Empenhos</h4>
                                                    <span className="text-xs font-medium bg-blue-100 text-blue-800 px-2 py-1 rounded-full">{details.empenhos.length} empenhos</span>
                                                </div>
                                                {details.empenhos.length > 0 ? (
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-sm text-left">
                                                            <thead className="text-xs text-gray-500 bg-gray-50/50 uppercase">
                                                                <tr>
                                                                    <th className="px-4 py-3">Número NE</th>
                                                                    <th className="px-4 py-3">Unidade Emissora</th>
                                                                    <th className="px-4 py-3">Data</th>
                                                                    <th className="px-4 py-3 text-right">Qtd</th>
                                                                    <th className="px-4 py-3 text-right">Valor Empenhado</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-gray-100">
                                                                {details.empenhos.map((emp, i) => (
                                                                    <tr key={i} className="hover:bg-gray-50">
                                                                        <td className="px-4 py-3 font-medium text-blue-600">{emp.num}</td>
                                                                        <td className="px-4 py-3 text-gray-700 text-xs truncate max-w-xs">{emp.unidade}</td>
                                                                        <td className="px-4 py-3 text-gray-500 whitespace-nowrap">{emp.data}</td>
                                                                        <td className="px-4 py-3 text-right">{emp.qtdEmpenhada}</td>
                                                                        <td className="px-4 py-3 text-right font-semibold">{formatMoney(emp.valor)}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                ) : (
                                                    <div className="p-6 text-center text-gray-500">Nenhum empenho registrado para este item.</div>
                                                )}
                                            </div>
                                            
                                            {details.contratos && details.contratos.length > 0 && (
                                                <div className="bg-white border rounded-xl overflow-hidden shadow-sm">
                                                     <div className="bg-gray-50 px-4 py-3 border-b border-gray-100 flex justify-between items-center">
                                                        <h4 className="font-semibold text-gray-700">Contratos Vinculados</h4>
                                                    </div>
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-sm text-left">
                                                            <thead className="text-xs text-gray-500 bg-gray-50/50 uppercase">
                                                                <tr>
                                                                    <th className="px-4 py-3">Número Contrato/NE</th>
                                                                    <th className="px-4 py-3">Unidade</th>
                                                                    <th className="px-4 py-3 text-right">Qtd. Contratada</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-gray-100">
                                                                {details.contratos.map((con, i) => (
                                                                    <tr key={i} className="hover:bg-gray-50">
                                                                        <td className="px-4 py-3 font-medium text-indigo-600">{con.num}</td>
                                                                        <td className="px-4 py-3 text-gray-700 text-xs">{con.unidade}</td>
                                                                        <td className="px-4 py-3 text-right font-semibold">{con.qtd}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center py-12 text-gray-500 bg-white rounded-xl border border-dashed border-gray-300">
                                            <FileTextIcon />
                                            <p className="mt-4 font-medium text-gray-700">Dados não processados</p>
                                            <p className="text-sm max-w-md text-center mt-2">Os empenhos e contratos detalhados requerem a carga completa do documento. (Demonstração nos Itens 00001, 00002 e 00003).</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedItem, setSelectedItem] = React.useState(null);

            // Filtragem da tabela baseada em busca
            const filteredItems = ITEMS_SUMMARY.filter(item => 
                item.desc.toLowerCase().includes(searchQuery.toLowerCase()) || 
                item.cod.includes(searchQuery) ||
                item.id.includes(searchQuery)
            );

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar Clássica */}
                    <div className="w-full md:w-64 bg-gray-900 text-white flex-col hidden md:flex shrink-0">
                        <div className="p-6 border-b border-gray-800">
                            <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                                <BuildingIcon />
                                PNCP View
                            </h1>
                            <p className="text-xs text-gray-400 mt-2 font-medium tracking-wide uppercase">Governo Federal</p>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-2">
                            <a href="#" className="flex items-center space-x-3 px-4 py-3 bg-blue-600/20 text-blue-400 rounded-lg font-medium transition-colors">
                                <FileTextIcon />
                                <span>Ata de Registro</span>
                            </a>
                        </nav>
                        <div className="p-6 border-t border-gray-800 text-xs text-gray-500">
                            Relatório gerado em 18/09/2026<br/>UG: 158276
                        </div>
                    </div>

                    {/* Conteúdo Principal */}
                    <div className="flex-1 flex flex-col overflow-hidden h-screen">
                        {/* Header Minimalista */}
                        <header className="bg-white border-b border-gray-200 py-4 px-6 md:px-8 flex justify-between items-center shrink-0">
                            <div>
                                <h2 className="text-xl font-bold text-gray-800">Ata SRP nº {ATA_GLOBAL_INFO.numero}</h2>
                                <p className="text-sm text-gray-500 mt-1">{ATA_GLOBAL_INFO.ug}</p>
                            </div>
                            <div className="hidden lg:block text-right">
                                <p className="text-sm font-semibold text-gray-800">Atualizado: {ATA_GLOBAL_INFO.atualizacao}</p>
                                <a href={ATA_GLOBAL_INFO.link} target="_blank" rel="noopener noreferrer" className="text-xs text-blue-600 hover:underline">Ver no PNCP ↗</a>
                            </div>
                        </header>

                        {/* Corpo Roleável */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            
                            {/* Resumo do Objeto e Fornecedor */}
                            <div className="mb-6 md:mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-6">
                                <div className="flex-1">
                                    <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Objeto da Ata</h3>
                                    <p className="text-gray-700 leading-relaxed text-sm">{ATA_GLOBAL_INFO.objeto}</p>
                                </div>
                                <div className="flex-1 md:border-l md:pl-6 border-gray-100">
                                    <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Fornecedor Vencedor</h3>
                                    <p className="text-gray-800 font-semibold">{ATA_GLOBAL_INFO.fornecedor.split(" - ")[1]}</p>
                                    <p className="text-gray-500 text-sm mt-1">CNPJ: {ATA_GLOBAL_INFO.fornecedor.split(" - ")[0]}</p>
                                    
                                    <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mt-4 mb-1">Vigência</h3>
                                    <p className="text-gray-800 font-medium">{ATA_GLOBAL_INFO.vigencia}</p>
                                </div>
                            </div>

                            {/* KPIs */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <KPICard 
                                    title="Valor Total Contratado" 
                                    value={formatMoney(ATA_GLOBAL_INFO.valorContratado)} 
                                    icon={<BadgeDollarIcon />} 
                                    bgClass="bg-gradient-to-br from-green-500 to-emerald-700" 
                                />
                                <KPICard 
                                    title="Itens Homologados" 
                                    value={ITEMS_SUMMARY.length} 
                                    icon={<FileTextIcon />} 
                                    bgClass="bg-gradient-to-br from-blue-500 to-indigo-700" 
                                />
                                <KPICard 
                                    title="Órgão Gerenciador" 
                                    value="IFMA" 
                                    icon={<BuildingIcon />} 
                                    bgClass="bg-gradient-to-br from-purple-500 to-fuchsia-700" 
                                />
                            </div>

                            {/* Tabela de Itens */}
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                                <div className="p-6 border-b border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <h3 className="text-lg font-bold text-gray-800">Itens da Ata ({filteredItems.length})</h3>
                                    
                                    <div className="relative w-full md:w-auto">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                            <SearchIcon />
                                        </div>
                                        <input 
                                            type="text" 
                                            placeholder="Buscar item, código..." 
                                            className="pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent w-full md:w-80 transition-shadow"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                        />
                                    </div>
                                </div>

                                <div className="overflow-x-auto w-full">
                                    <table className="w-full text-sm text-left text-gray-600 min-w-[800px]">
                                        <thead className="text-xs text-gray-500 uppercase bg-gray-50/80 border-b border-gray-100">
                                            <tr>
                                                <th className="px-6 py-4 font-semibold">Item</th>
                                                <th className="px-6 py-4 font-semibold">Código</th>
                                                <th className="px-6 py-4 font-semibold w-2/5">Descrição Resumida</th>
                                                <th className="px-6 py-4 font-semibold text-right">Qtd</th>
                                                <th className="px-6 py-4 font-semibold text-right">Valor Unit.</th>
                                                <th className="px-6 py-4 font-semibold text-right">Total Previsto</th>
                                                <th className="px-6 py-4 font-semibold text-center">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {filteredItems.map(item => (
                                                <tr key={item.id} className="hover:bg-blue-50/50 transition-colors group">
                                                    <td className="px-6 py-4 font-semibold text-gray-900">{item.id}</td>
                                                    <td className="px-6 py-4 text-gray-500">{item.cod}</td>
                                                    <td className="px-6 py-4 font-medium text-gray-700 truncate max-w-[200px] md:max-w-xs" title={item.desc}>{item.desc}</td>
                                                    <td className="px-6 py-4 text-right font-medium">{formatNumber(item.qtd)}</td>
                                                    <td className="px-6 py-4 text-right text-gray-500">{formatMoney(item.valUnit)}</td>
                                                    <td className="px-6 py-4 text-right font-semibold text-gray-800">{formatMoney(item.qtd * item.valUnit)}</td>
                                                    <td className="px-6 py-4 text-center">
                                                        <button 
                                                            onClick={() => setSelectedItem(item)}
                                                            className="inline-flex items-center space-x-1 text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors font-medium text-xs whitespace-nowrap"
                                                        >
                                                            <EyeIcon /> <span>Detalhes</span>
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredItems.length === 0 && (
                                                <tr>
                                                    <td colSpan="7" className="px-6 py-12 text-center text-gray-500">
                                                        Nenhum item encontrado com a busca "{searchQuery}"
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Modal Viewer */}
                    {selectedItem && (
                        <ItemModal 
                            item={selectedItem} 
                            onClose={() => setSelectedItem(null)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
